name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -o LuckPatchUltimate-Source-GitHub-Actions-1.zip
          cd luckpatch-ultimate
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LuckPatchUltimate-APK
          path: luckpatch-ultimate/app/build/outputs/apk/debug/app-debug.apk
